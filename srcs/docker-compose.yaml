services:
  nginx:
    build:
      context: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - wordpress
    env_file:
      - .env
    restart: always
    networks:
      - inception_network

  wordpress:
    build:
      context: ./requirements/wordpress
    container_name: wordpress
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - db
      - redis
    env_file:
      - .env
    restart: always
    networks:
      - inception_network

  db:
    build:
      context: ./requirements/mariadb
    container_name: mariadb
    volumes:
      - mariadb:/var/lib/mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - inception_network

  redis:
    build:
      context: ./requirements/redis
    container_name: redis
    restart: always
    networks:
      - inception_network

  ftp:
    build:
      context: ./requirements/ftp
    container_name: ftp
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    volumes:
      - wordpress:/var/www/html
    env_file:
      - .env
    restart: always
    networks:
      - inception_network

  adminer:
    build:
      context: ./requirements/adminer
    container_name: adminer
    expose:
      - "8080"
    networks:
      - inception_network
    restart: always

  static-site:
    build:
      context: ./requirements/static-site
    container_name: static-site
    expose:
      - "8443"
    restart: always
    networks:
      - inception_network

  cadvisor:
    build:
      context: ./requirements/cadvisor
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    expose:
      - "8181"
    networks:
      - inception_network

networks:
  inception_network:
    driver: bridge

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rmakende/data/wordpress
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/rmakende/data/mariadb
